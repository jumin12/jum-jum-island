  function drawModifier() {
    const s = game.station;
    if (s < 2) {
      if (s === 0 && game.combo > 0) {
        ctx.save();
        ctx.translate(129,221);
        const pulse = 1+game.comboPulse*.11;
        ctx.scale(pulse,pulse);
        rounded(-91, -28, 182, 56, 28, "rgba(255,248,223,.94)", STATIONS[s].color, 4);
        text(`STREAK ×${game.combo}`, 0, -7, 17, "#71482e");
        for (let i=0;i<5;i++) {
          ctx.fillStyle = i < Math.min(5,game.combo) ? "#ffd34f" : "#dacfb3";
          ctx.beginPath(); ctx.arc(-40+i*20,13,5,0,TAU); ctx.fill();
        }
        ctx.restore();
      }
      return;
    }
    if (s === 6) {
      rounded(44, 268, 204, 54, 27, "rgba(255,248,223,.93)", STATIONS[s].color, 4);
      drawItem(6, 7, 76, 295, itemDisplaySize(6, 7, 42));
      text(`STAR LINK ${game.constellation}/3`, 160, 295, 15, "#51457d");
      if (game.modifierFlash > 0) {
        ctx.save();
        ctx.globalAlpha = game.modifierFlash;
        drawItem(6, 7, 360, 700, itemDisplaySize(6, 7, 140));
        shadowText("CONSTELLATION!", 360, 810, 30, "#f4f2ff");
        ctx.restore();
      }
      return;
    }
    const isGarden = s === 2, isMarina = s === 3, isLagoon = s === 5;
    if (s === 4) return;
    const every = isGarden ? 5 : isMarina ? 4 : 0;
    const remaining = every ? every - (game.shots % every) : 0;
    const icon = isGarden ? 12 : isMarina ? 13 : 14;
    rounded(44, 268, 176, 54, 27, "rgba(255,248,223,.93)", STATIONS[s].color, 4);
    drawUi(icon, 76, 295, 48);
    if (isLagoon) text("BUBBLES", 143, 295, 16, "#71482e");
    else text(`${remaining} SLIDES`, 147, 295, 16, "#71482e");
    if (game.modifierFlash > 0) {
      ctx.save();
      ctx.globalAlpha = game.modifierFlash;
      drawUi(icon, 360, 700, 150);
      shadowText(isGarden ? "WIND SHIFT!" : isMarina ? "TIDE TURN!" : "POP!", 360, 810, 32, "#fff8df");
      ctx.restore();
    }
  }

  function drawRecipeStrip() {
    rounded(28, 1158, 664, 103, 34, "rgba(255,250,232,.97)", "#6c9b4c", 5);
    const station = game.station;
    const tiers = [];
    for (let i = 0; i < 9; i++) tiers.push(i - 1);
    const scales = tiers.map(tier => itemSizeScale(station, tier));
    const minScale = Math.min(...scales);
    const maxScale = Math.max(...scales);
    const span = Math.max(0.001, maxScale - minScale);
    for (let i = 0; i < 9; i++) {
      const tier = tiers[i];
      const x = 52 + i * 72;
      const t = (scales[i] - minScale) / span;
      // Smallest on the left, largest on the right — mirrors in-game piece scale.
      const size = 34 + t * 54;
      if (i < 8) text("›", x + 37, 1209, 18, "#9c7048");
      drawItem(station, tier, x, 1208, size);
    }
  }

  function drawTutorial() {
    const pages = [
      {
        title: "JUMIN'S CRASH COURSE",
        body: "Welcome to " + STATIONS[game.station].name + "! Jum Jum berries flavor every menu here. First lesson: empty utensils merge into real bottles.",
        pose: 0,
        art: "merge"
      },
      {
        title: "LAUNCH & SERVE",
        body: "Tap the table or slide up from the bottom to launch. Guests only order finished drinks — never empties. Fill the guest bar to finish the shift.",
        pose: 1,
        art: "launch"
      },
      {
        title: "ICE & POWERUPS",
        body: "Frozen bottles can't match until you thaw them. Use Skip, Any Glass, Berry Magnet, and Sun Thaw from the side icons — buy more in Jumin's shop.",
        pose: 3,
        art: "powerups"
      }
    ];
    const pageIndex = Math.max(0, Math.min(pages.length - 1, game.tutorialPage|0));
    const page = pages[pageIndex];
    const last = pageIndex >= pages.length - 1;
    ctx.fillStyle = "rgba(10,55,59,.47)";
    ctx.fillRect(0,0,W,H);
    drawJuminGuidePanel({
      title: page.title,
      body: page.body,
      pose: page.pose,
      accent: STATIONS[game.station].color,
      pageIndex,
      pageCount: pages.length,
      art: page.art,
      stationName: STATIONS[game.station].name,
      buttonId: "tutorialNext",
      buttonLabel: last ? "START SERVING" : "NEXT TIP",
      onButton: () => {
        if (last) {
          game.tutorial = false;
          save.tutorial[game.station] = true;
          persist();
        } else {
          game.tutorialPage = pageIndex + 1;
        }
      }
    });
  }

  function drawModal() {
    if (!modal) return;
    ctx.fillStyle = "rgba(9,57,62,.58)";
    ctx.fillRect(0,0,W,H);
    if (modal.type === "help" || modal.type === "story") {
      const pages = modal.type === "help"
        ? helpPages()
        : (modal.pages || [{ title: modal.title, body: modal.body, pose: 0, art: "welcome" }]).map((page, index) => ({
            title: page.title,
            body: page.body,
            pose: page.pose != null ? page.pose : (index === 0 ? 0 : index === 1 ? 1 : 2),
            art: page.art || (index === 0 ? "welcome" : index === 1 ? "serve" : "frozen")
          }));
      const pageIndex = Math.max(0, Math.min(pages.length - 1, modal.page|0));
      const page = pages[pageIndex];
      const last = pageIndex >= pages.length - 1;
      drawJuminGuidePanel({
        title: page.title,
        body: page.body,
        pose: page.pose,
        accent: modal.type === "help" ? "#3eb1d0" : "#55bd78",
        pageIndex,
        pageCount: pages.length,
        art: page.art,
        buttonId: modal.type === "help" ? "helpNext" : "storyok",
        buttonLabel: last ? (modal.type === "help" ? "GOT IT!" : "LET'S GO!") : "NEXT",
        onButton: () => {
          if (last) modal = null;
          else modal.page = pageIndex + 1;
        }
      });
    } else if (modal.type === "shift") {
      const station = STATIONS[modal.station];
      rounded(48, 288, 624, 664, 40, "#fff9e7", station.color, 7);
      drawUi(7, 360, 370, 116);
      shadowText(modal.title, 360, 456, 36, station.color);
      text(station.name, 360, 501, 20, "#765c4e");
      rounded(102,526,516,66,26,modal.newBest ? "#fff1af" : "#f3ead2",modal.newBest ? "#e4a72e" : "#c2a97f",4);
      drawUi(1,139,559,52);
      text(modal.newBest ? "NEW HIGH SCORE" : "SHIFT SCORE",176,548,14,modal.newBest ? "#a35d27" : "#8b6b58","left");
      text(formatNumber(modal.score),176,572,26,"#59392d","left");
      text(`BEST ${formatNumber(modal.highScore)}`,578,559,16,"#8b6b58","right");
      const stats = [
        [0, "COINS", modal.coins],
        [2, "TOOLS", modal.tools],
        [15, "MERGES", modal.merges],
        [1, "BEST CHAIN", "×"+modal.chain]
      ];
      stats.forEach((entry,index) => {
        const col = index%2, row = Math.floor(index/2);
        const x = 102+col*265, y = 607+row*96;
        rounded(x,y,250,80,22,"#f3ead2","#c2a97f",3);
        drawUi(entry[0],x+43,y+40,54);
        text(entry[1],x+82,y+25,14,"#8b6b58","left");
        text(String(entry[2]),x+82,y+53,22,"#59392d","left");
      });
      drawButton("continue", "KEEP SERVING", 102, 814, 244, 70, station.color, () => {
        const index = modal.station;
        modal = null;
        startStation(index);
      }, true, true);
      drawButton("island", "VISIT ISLAND", 374, 814, 244, 70, "#55bd78", () => {
        modal = null;
        game = null;
        screen = "map";
      }, true, true);
      text("Keep serving Jum Jum Island — Jumin packs more powerups as you go.", 360, 916, 15, "#80685b", "center", 700, 525);
    } else if (modal.type === "shiftFail") {
      const station = STATIONS[modal.station];
      rounded(48, 340, 624, 520, 40, "#fff9e7", "#f47d63", 7);
      shadowText(modal.title, 360, 420, 36, "#f47d63");
      text(station.name, 360, 468, 20, "#765c4e");
      text(`Guests served  ${modal.guests}/${modal.goal}`, 360, 520, 22, "#59392d");
      text(`Score  ${formatNumber(modal.score)}`, 360, 568, 26, "#59392d");
      text(`Best  ${formatNumber(modal.highScore)}`, 360, 610, 18, "#8b6b58");
      wrapText("You ran out of shots before finishing every guest. Aim carefully and merge smarter next shift.", 360, 660, 500, 28, 18, "#80685b", "center", 700);
      drawButton("retryFail", "TRY AGAIN", 102, 740, 244, 70, station.color, () => {
        const index = modal.station;
        modal = null;
        startStation(index);
      }, true, true);
      drawButton("islandFail", "VISIT ISLAND", 374, 740, 244, 70, "#55bd78", () => {
        modal = null;
        game = null;
        screen = "map";
      }, true, true);
    } else if (modal.type === "resetConfirm") {
      rounded(70, 390, 580, 420, 38, "#fff9e7", "#f47d63", 7);
      shadowText(modal.title, 360, 470, 32, "#f47d63");
      wrapText(modal.body, 360, 530, 480, 30, 20, "#62473d", "center", 700);
      drawButton("resetYes", "YES, RESET", 110, 660, 230, 70, "#f47d63", () => resetProgress(), true, true);
      drawButton("resetNo", "CANCEL", 380, 660, 230, 70, "#55bd78", () => { modal = null; }, true, true);
    }
  }

  function update(dt) {
    time += dt;
    updateEffects(dt);
    if (screen === "map" || screen === "menu" || screen === "scores" || screen === "achievements") {
      mapPulse += dt;
      for (const person of mapTourists) {
        person.t += person.speed*dt;
        if (person.t > 1) person.t -= 1;
        person.step = (person.step + person.cadence*dt) % 4;
      }
    }
    if (screen === "play") updateGame(dt);
  }

  function draw() {
    buttons = [];
    ctx.clearRect(0,0,W,H);
    if (screen === "loading") drawLoading();
    else if (screen === "menu") drawMenu();
    else if (screen === "scores") drawScores();
    else if (screen === "achievements") drawAchievements();
    else if (screen === "map") drawMap();
    else if (screen === "shop") drawShop();
    else if (screen === "play" && game) drawPlay();
    drawEffects();
    if (modal) drawModal();
  }

  function frame(now) {
    const dt = Math.min(.05, (now-lastFrame)/1000 || 0);
    lastFrame = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function canvasPoint(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX-rect.left)*W/rect.width,
      y: (event.clientY-rect.top)*H/rect.height
    };
  }

  canvas.addEventListener("pointerdown", event => {
    event.preventDefault();
    const p = canvasPoint(event);
    pointer.down = true;
    pointer.x = pointer.sx = p.x;
    pointer.y = pointer.sy = p.y;
    pointer.dragging = false;
    pressedButton = null;
    for (let i = buttons.length-1; i >= 0; i--) {
      if (pointIn(buttons[i], p.x, p.y) && buttons[i].enabled) {
        pressedButton = buttons[i].id;
        break;
      }
    }
    if (!pressedButton && screen === "play" && game && game.readyTimer <= 0 && !game.serving && !game.tutorial && !modal && !game.chooseMode && game.shotsLeft > 0 && p.y > 930) {
      game.launchX = clampLauncherX(p.x);
      game.aimVX = 0;
    }
    try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
  }, { passive: false });

  canvas.addEventListener("pointermove", event => {
    if (!pointer.down) return;
    event.preventDefault();
    const p = canvasPoint(event);
    pointer.x = p.x; pointer.y = p.y;
    if (Math.hypot(pointer.x-pointer.sx, pointer.y-pointer.sy) > 14) {
      pointer.dragging = true;
      if (screen === "play" && game && game.readyTimer <= 0 && !game.serving && !game.tutorial && !modal && !game.chooseMode && game.shotsLeft > 0 && pointer.sy > 930) {
        if (pointer.y > 930) {
          game.launchX = clampLauncherX(pointer.x);
          game.aimVX = 0;
        } else {
          game.aimVX = clamp((pointer.x-game.launchX)*3.2,-430,430);
        }
      }
    }
  }, { passive: false });

  canvas.addEventListener("pointerup", event => {
    event.preventDefault();
    const p = canvasPoint(event);
    const button = buttons.find(entry => entry.id === pressedButton && entry.enabled && pointIn(entry,p.x,p.y));
    if (button) {
      button.action();
    } else if (screen === "play" && game && game.readyTimer <= 0 && !game.serving && !game.tutorial && !modal && !game.chooseMode && game.shotsLeft > 0) {
      const upward = pointer.sy-pointer.y > 28;
      const tappedTable = pointer.sy > 420 && pointer.sy < 930 && !pointer.dragging;
      const touchedLauncher = pointer.sy > 930;
      if (tappedTable) {
        game.launchX = clampLauncherX(p.x);
        launchPiece(game.launchX, 0);
      } else if (touchedLauncher && ((pointer.dragging && upward) || !pointer.dragging)) {
        launchPiece(game.launchX, game.aimVX);
      }
    }
    pointer.down = false;
    pointer.dragging = false;
    pressedButton = null;
  }, { passive: false });

  canvas.addEventListener("pointercancel", () => {
    pointer.down = false;
    pointer.dragging = false;
    pressedButton = null;
  });

  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        if (shell.requestFullscreen) await shell.requestFullscreen();
        else if (shell.webkitRequestFullscreen) shell.webkitRequestFullscreen();
        else if (canvas.requestFullscreen) await canvas.requestFullscreen();
      } else if (document.exitFullscreen) {
        await document.exitFullscreen();
      }
    } catch (_) {}
    fitCanvas();
  }

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && document.fullscreenElement) return;
    if (event.key.toLowerCase() === "f") {
      event.preventDefault();
      toggleFullscreen();
    }
  });
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", () => setTimeout(fitCanvas, 120));
  document.addEventListener("fullscreenchange", fitCanvas);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitCanvas);
  }
  fitCanvas();

  window.render_game_to_text = () => {
    const state = {
      screen,
      coordinates: "720x1280 logical canvas; origin at top-left; x increases right and y increases down",
      selectedStation,
      resources: {
        coins: save.coins,
        stars: save.stars,
        tools: save.tools,
        reputation: save.reputation,
        highScore: save.highScore,
        lifetimeScore: save.lifetimeScore
      },
      theme: {
        selected: save.selectedTheme,
        name: THEMES[save.selectedTheme].name,
        gameplayMotion: THEMES[save.selectedTheme].motion,
        islandFeature: THEMES[save.selectedTheme].islandFeature,
        itemsThemed: true,
        tableThemed: true,
        owned: save.ownedThemes.map((owned,index) => owned ? THEMES[index].name : null).filter(Boolean)
      },
      venueCount: STATIONS.length,
      waterAnimation: {
        active: false,
        mode: "static painted island background"
      },
      secretSkin: {
        name: "Jamaican Breeze",
        unlocked: save.jamaicanUnlocked,
        owned: !!save.ownedThemes[5]
      },
      island: STATIONS.map((station,index) => ({
        name: station.name,
        unlocked: save.unlocked[index],
        level: save.levels[index],
        shifts: save.shifts[index],
        served: save.served[index],
        itemSet: [BASE_NAMES[index], ...ITEM_NAMES[index]].join(" > "),
        location: {
          x: mapSite(index).x,
          y: mapSite(index).y,
          size: mapSite(index).s
        }
      })),
      modal: modal ? modal.type : null
    };
    if (screen === "map") {
      const gull = seagullPose();
      state.seagull = {
        x: Math.round(gull.x),
        y: Math.round(gull.y),
        spriteFrame: Math.floor(time * 8) % 8,
        clickable: true,
        secretFound: save.jamaicanUnlocked
      };
      state.walkers = mapTourists.map((person,index) => {
        const position = mapPath(person.path,person.t);
        return {
          id: index,
          role: person.worker ? "crew" : "tourist",
          route: person.path,
          x: Math.round(position.x),
          y: Math.round(position.y)
        };
      });
    }
    if (game) {
      state.stationGame = {
        station: STATIONS[game.station].name,
        physics: "continuous free-positioned circular bodies; no lane snapping",
        tableEndCenterY: PHYSICS_TOP,
        pieces: game.pieces.map(piece => ({
          id: piece.id,
          tier: piece.tier,
          name: itemName(game.station, piece.tier),
          x: Math.round(piece.x),
          y: Math.round(piece.y),
          vx: Math.round(piece.vx),
          vy: Math.round(piece.vy),
          radius: Math.round(piece.r),
          sizeScale: itemSizeScale(game.station, piece.tier),
          bubble: piece.bubble,
          settled: piece.settled
        })),
        currentTier: game.current,
        nextTier: game.next,
        itemSizes: [BASE_TIER,0,1,2,3,4,5,6,7].map(tier => ({
          tier,
          name: itemName(game.station, tier),
          radius: Math.round(pieceRadius(tier, game.station)),
          scale: itemSizeScale(game.station, tier)
        })),
        launcherX: Math.round(game.launchX),
        aimVX: Math.round(game.aimVX),
        ready: game.readyTimer <= 0,
        moving: game.moving,
        order: game.order ? {
          targets: game.order.targets,
          targetNames: game.order.targets.map(tier => itemName(game.station, tier)),
          done: game.order.done,
          value: game.order.value
        } : null,
        servingPhase: game.serving ? game.serving.phase : null,
        shelf: game.shelf.map(item => ({tier:item.tier,name:itemName(game.station,item.tier)})),
        guests: `${game.ordersThisShift}/${game.goal}`,
        score: game.score,
        highScore: save.highScore,
        newBest: game.newBest,
        combo: game.combo,
        shots: game.shots,
        modifier: STATIONS[game.station].icon,
        constellationProgress: game.station === 6 ? game.constellation : null,
        missionDone: game.missionDone,
        tutorial: game.tutorial
      };
    }
    if (screen === "shop") {
      state.shop = THEMES.map((theme,index) => ({
        name: theme.name,
        cost: theme.cost,
        owned: save.ownedThemes[index],
        selected: save.selectedTheme === index,
        affordable: !theme.secret && save.coins >= theme.cost,
        secret: !!theme.secret
      }));
    }
    return JSON.stringify(state);
  };

  window.advanceTime = milliseconds => {
    const steps = Math.max(1, Math.ceil(milliseconds/16.6667));
    const dt = milliseconds/1000/steps;
    for (let i=0;i<steps;i++) update(dt);
    draw();
  };

  preload();
  requestAnimationFrame(frame);
  </script>
</body>
</html>
